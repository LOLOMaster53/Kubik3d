    <script>
        lucide.createIcons();
        function downloadClientVCard() {
            const vcf = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                "FN:Kubik3D_Mendoza",
                "TITLE:CHAUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUU",
                "TEL;TYPE=CELL,VOICE:+54 2616595758",
                "EMAIL:kubik3d_mendoza@gmail.com",
                "END:VCARD"
            ].join("\r\n");
            const blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "contacto.vcf";
            a.click();
        }
